version: 1
project:
  name: casa
  description: >
    Narrow pressure slice for CASA's documented Docker Compose development flow, keeping app-level
    database reset distinct from broad Compose teardown.
execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          docker: "*"
services:
  web:
    manager:
      kind: compose
      name: casa
      file: docker-compose.yml
      service: web
    endpoints:
      host:
        address: 127.0.0.1
        port: 3000
    readiness:
      kind: tcp
      from: host
  database:
    manager:
      kind: compose
      name: casa
      file: docker-compose.yml
      service: database
    endpoints:
      host:
        address: 127.0.0.1
        port: 5435
    readiness:
      kind: tcp
      from: host
tasks:
  stack:up:
    context: host
    description: Start the documented CASA Docker Compose services
    notes: Mirrors the ongoing development command `docker compose up -d`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - docker-compose.yml
          project_name: casa
    compose:
      kind: up
      detach: true
    depends_on:
      - db:reset
      - assets:build
      - assets:build:css
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
  deps:ruby:
    context: host
    description: Install Ruby dependencies in the documented one-off web container
    notes: Mirrors the manual setup command `docker compose run --rm web bundle install`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - docker-compose.yml
          project_name: casa
    command:
      exe: docker
      args:
        - compose
        - run
        - --rm
        - web
        - bundle
        - install
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
  db:reset:
    context: host
    description: Reset the CASA development and test databases in the documented web container
    notes: >
      Mirrors the manual setup command `docker compose run --rm web rails db:reset`, which is
      application-level database reset rather than Compose volume ownership.
    adapter_inputs:
      overlays:
        compose:
          files:
            - docker-compose.yml
          project_name: casa
    command:
      exe: docker
      args:
        - compose
        - run
        - --rm
        - web
        - rails
        - db:reset
    depends_on:
      - deps:ruby
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
    safe_for_agent: false
  deps:node:
    context: host
    description: Install JavaScript dependencies in the documented one-off web container
    notes: Mirrors the manual setup command `docker compose run --rm web npm install`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - docker-compose.yml
          project_name: casa
    command:
      exe: docker
      args:
        - compose
        - run
        - --rm
        - web
        - npm
        - install
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
  assets:build:
    context: host
    description: Build the documented JavaScript assets in the one-off web container
    notes: Mirrors the manual setup command `docker compose run --rm web npm run build`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - docker-compose.yml
          project_name: casa
    command:
      exe: docker
      args:
        - compose
        - run
        - --rm
        - web
        - npm
        - run
        - build
    depends_on:
      - deps:node
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
  assets:build:css:
    context: host
    description: Build the documented CSS assets in the one-off web container
    notes: Mirrors the manual setup command `docker compose run --rm web npm run build:css`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - docker-compose.yml
          project_name: casa
    command:
      exe: docker
      args:
        - compose
        - run
        - --rm
        - web
        - npm
        - run
        - build:css
    depends_on:
      - deps:node
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
  stack:clean:
    context: host
    description: Tear down CASA containers, volumes, and networks for a documented clean slate
    notes: >
      Mirrors the manual setup command `docker compose down -v`. This is intentionally modeled as
      broad teardown, not as service-volume reset, because the repo documents it as full stack
      cleanup.
    adapter_inputs:
      overlays:
        compose:
          files:
            - docker-compose.yml
          project_name: casa
    compose:
      kind: down
      remove_volumes: true
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
    safe_for_agent: false
workflows:
  default: local-docker
  local-docker:
    intent: local_development
    description: >
      Documented CASA Docker Compose setup path for local development, including dependency
      hydration, database reset, asset build, and service startup.
    prepare:
      task: stack:up
agent:
  posture: readiness_strict
  entrypoint: stack:up
  default_task: stack:up
  protected_paths:
    - .github/workflows
    - docker-compose.yml
    - ota.yaml
  bootstrap:
    ota:
      note: Install ota only when missing so contributors and agents can use the readiness workflows declared here.
      source:
        kind: git_rev
        rev: f78c7f1cd4fdae0c92be06d9834e2b3c9957beee
  notes: |
    This contract intentionally scopes CASA to the documented Docker Compose development flow.
    Review `ota tasks --use` before execution; the modeled tasks mutate Docker, database, or asset-build state
    and are not declared agent-safe by default.
    Use `ota up --workflow local-docker` for the documented setup path.
metadata:
  ota:
    minimum_version: "1.6.22"
